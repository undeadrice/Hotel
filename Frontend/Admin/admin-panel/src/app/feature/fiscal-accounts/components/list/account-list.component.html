<mat-card>
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>Fiscal Accounts dashboard</mat-card-title>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="accounts">
      <ng-container matColumnDef="OriginatorId">
        <th mat-header-cell *matHeaderCellDef>Originator</th>
        <td mat-cell *matCellDef="let account">{{ account.originatorId }}</td>
      </ng-container>

      <ng-container matColumnDef="OwnerId">
        <th mat-header-cell *matHeaderCellDef>Owner</th>
        <td mat-cell *matCellDef="let account">{{ account.ownerId }}</td>
      </ng-container>

      <ng-container matColumnDef="FolioCount">
        <th mat-header-cell *matHeaderCellDef>Folios</th>
        <td mat-cell *matCellDef="let account">{{ account.folioCount }}</td>
      </ng-container>

      <ng-container matColumnDef="CreatedAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let account">{{ account.createdAt | date: 'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let account">
          <button mat-button color="primary" (click)="viewAccount(account.id)">View</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
