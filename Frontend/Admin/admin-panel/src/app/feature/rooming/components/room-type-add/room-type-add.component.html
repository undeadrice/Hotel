<mat-card style="max-width: 1200px; margin: 0 auto">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>Create room type</mat-card-title>
      <button mat-stroked-button routerLink="/room-types">Back</button>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Room type details</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <mat-form-field appearance="outline" style="width: 100%">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" placeholder="e.g. Standard" />
            @if (form.get('name')?.hasError('required')) {
              <mat-error>Name is required</mat-error>
            } @else if (form.get('name')?.hasError('minlength')) {
              <mat-error>Name must be at least 2 characters</mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline" style="width: 100%">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" placeholder="Optional description"></textarea>
          </mat-form-field>
        </mat-card-content>
      </mat-card>

      <div style="margin-top: 16px; display: flex; gap: 8px">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid || submitting()"
        >
          Create room type
        </button>
        <button mat-button type="button" routerLink="/room-types">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
